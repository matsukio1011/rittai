="dark"] .tag,html[data-theme="dark"] .note,html[data-theme="dark"] .footer,html[data-theme="dark"] .verify span,html[data-theme="dark"] .stat span,html[data-theme="dark"] .peel-status,html[data-theme="dark"] .explain{color:#c1cfe2}html[data-theme="dark"] .eyebrow{color:#9bbeff}html[data-theme="dark"] .count{border-color:#485c78}html[data-theme="dark"] button:disabled{opacity:.55}#netPanel{background:#f0f5ff;border:1px solid #b8ccec;border-radius:8px;padding:10px;margin-bottom:10px}#netPanel[hidden]{display:none}.net-actions{display:flex;gap:5px;margin:8px 0}.net-actions button{padding:6px;min-height:32px;font-size:13px;flex:1}#netPanel label{font-size:13px;display:block;margin-top:7px}#netBase{width:100%;font:inherit;font-size:14px;padding:6px;border:1px solid #a8bad4;border-radius:6px;background:white;color:#18283f}#netFold{width:100%;accent-color:#7651c9}#netReference summary{font-size:13px;cursor:pointer}#netReference svg{width:100%;max-height:200px}html[data-theme="dark"] #netPanel{background:#1d2e46;border-color:#485c78}html[data-theme="dark"] #netBase{background:#26364e;color:#e1e9f5;border-color:#485c78}.solids{grid-template-columns:repeat(4,minmax(0,1fr))}.viewer{height:calc(100dvh - 195px)}.lesson{max-height:calc(100dvh - 195px)}@media(min-width:1200px){.solids{grid-template-columns:repeat(6,minmax(0,1fr))}.viewer{height:calc(100dvh - 150px)}.lesson{max-height:calc(100dvh - 150px)}}@media(max-width:650px){.solids{grid-template-columns:repeat(3,minmax(0,1fr))}.viewer{height:70dvh}.lesson{max-height:none}}.build-actions{flex-wrap:wrap}.build-actions button{flex:1 1 42%}@media(min-width:851px){.solids{grid-template-columns:repeat(6,minmax(0,1fr))}.solids button{padding:6px 8px}.viewer{height:calc(100dvh - 165px)}.lesson{max-height:calc(100dvh - 165px)}}</style></head><body><header><div class="mark" aria-hidden="true">◇</div><div><h1>立体のかぞえ方研究室</h1><p>回して発見。つながりから数えよう。</p></div><button id="darkMode" aria-pressed="false">ダークモード ON</button><button id="fullscreen" aria-pressed="false">全画面表示 ON</button><span id="fullscreenStatus" role="status"></span></header><main><nav class="solids" aria-label="立体を選ぶ"><button data-solid="3">正四面体</button><button data-solid="4">正六面体</button><button data-solid="5">正八面体</button><button data-solid="6">正十二面体</button><button data-solid="7">正二十面体</button><button data-solid="8">画像の三角すい・底面を選ぶ</button><button data-solid="9">正四面体を切る</button><button data-solid="1">正六面体を切る</button><button data-solid="10">正八面体を切る</button><button data-solid="11">正十二面体を切る</button><button data-solid="2">正二十面体を切る</button><button data-solid="0">正三角形の十六面体</button></nav><div class="layout"><section class="viewer" aria-label="立体の観察"><div class="viewhead"><strong id="shapeTitle"></strong><span class="tag">ドラッグして360°観察</span></div><canvas id="view" tabindex="0" aria-label="立体。ドラッグまたは矢印キーで回転できます"></canvas><p class="hint" id="viewHint">裏側も回して見てみよう。矢印キーでも回せるぞ。</p><div class="legend" id="legend"></div><div class="controls"><button id="rotate" aria-pressed="false">自動で回す</button><button id="reset">向きを戻す</button><button id="ghost" aria-pressed="false">裏側の線を見る</button></div><div class="peel-controls"><div class="peel-actions"><button id="peelAll">面をはがして並べる</button><button id="assemble">立体に戻す</button></div><label for="peel">立体から平らな面へ：つまみで途中を見よう</label><input id="peel" type="range" min="0" max="100" value="0" aria-label="面をはがす進み具合"><p class="peel-status" id="peelStatus" aria-live="polite"></p><div class="face-totals" id="faceTotals"></div><p class="note">面を形ごとに分けて並べるぞ。つながった展開図ではなく、1枚ずつ切り離した面だ。</p></div></section><section class="lesson"><section id="netPanel" hidden><strong>展開図と組み立て</strong><div class="net-actions"><button id="netOpen">展開図を見る</button><button id="netClose">通常の立体</button></div><label for="netBase">固定する底面</label><select id="netBase" aria-label="固定する底面"></select><p id="baseNote" class="note"></p><div class="net-actions"><button id="netPlay">組み立てる</button><button id="netUnfold">開く</button></div><label for="netFold">展開図 → 完成</label><input id="netFold" type="range" min="0" max="100" value="0" aria-label="組み立てる進み具合"><p id="netStatus" role="status" class="note"></p><p id="netNote" class="note"></p><details id="netReference"><summary>元の図と、底面を変える意味</summary><svg viewBox="-0.14 -0.14 1.3 1.3" role="img" aria-label="正方形ABCD、辺BCの中点E、辺CDの中点F。中央AEFとABE、ECF、ADFの4つの三角形。B、C、Dが重なる。"><path d="M0 0 L0 1 L.5 1Z" fill="#f6c777"/><path d="M.5 1L1 1L1 .5Z" fill="#83d6bf"/><path d="M0 0L1 0L1 .5Z" fill="#f1a8bc"/><path d="M0 0L.5 1L1 .5Z" fill="#87b0f7"/><path d="M0 0H1V1H0Z" fill="none" stroke="currentColor" stroke-width=".012"/><path d="M0 0L.5 1L1 .5Z" fill="none" stroke="currentColor" stroke-width=".009" stroke-dasharray=".025 .025"/><g fill="currentColor" font-size=".085"><text x="-.07" y="-.03">A</text><text x="-.07" y="1.1">B</text><text x="1.02" y="1.1">C</text><text x="1.02" y="-.03">D</text><text x=".47" y="1.1">E</text><text x="1.02" y=".52">F</text></g></svg><p class="note">底面を替えるのは、同じ立体の置き方を替えること。面4枚・辺6本・頂点4個も、体積も変わらない。底面の面積と、その面に垂直な高さは変わるぞ。</p><p class="note">外枠を正方形、E・Fを中点として作図したぞ。</p></details></section><details id="buildGuide" hidden><summary>作り方を見る：頂点を切り取る</summary><p id="buildIntro" class="note"></p><ol id="buildSteps"></ol><label for="cutDepth">切る深さ：<output id="cutLabel"></output></label><input id="cutDepth" type="range" min="0" max="100" step="0.1" value="100" aria-label="頂点を切る深さ"><div class="build-actions"><button id="cutStart">元の立体</button><button id="cutMiddle">切る途中</button><button id="cutFinish">辺がそろう位置</button><button id="cutTouch">切り口が接するまで</button></div><p id="cutMessage" class="note" aria-live="polite"></p></details><div class="tabs" aria-label="数えるもの"><button data-mode="0" class="active">面</button><button data-mode="1">辺</button><button data-mode="2">頂点</button></div><div aria-live="polite"><p class="eyebrow" id="stepLabel"></p><h2 id="lessonTitle"></h2><p class="explain" id="explain"></p><div class="formula" id="formula"></div><p class="note" id="note"></p></div><div class="stepper"><button id="prev">← 前の説明</button><button id="next">次の説明 →</button></div><div class="count"><label for="count">図で確かめる：色のついた部分を増やそう</label><div class="range"><input id="count" type="range" min="0" value="0"><output id="counter"></output></div></div><div class="summary" id="summary"></div></section></div><div class="verify"><b id="euler"></b><span>穴のない凸多面体で成り立つ、オイラーの公式</span></div><p class="footer" id="footnote"></p></main><script src="app.js"></script></body></html>
