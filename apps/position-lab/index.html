<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>なる？ならない？｜空間の直線と平面</title><meta name="description" content="条件に合う立体図を切り替えて、直線・平面の位置関係と反例を確かめよう。"><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><span class="logo">∠</span><div>なる？ならない？<small>空間の直線と平面</small></div></div><div class="header-actions"><button id="answerToggle" aria-pressed="true">答えを隠す</button><button id="theme" aria-label="配色を切り替える">明るく</button><button id="fullscreen">全画面</button></div></header>
<main><aside><div class="eyebrow">問題をえらぶ</div><nav id="problems" aria-label="問題一覧"></nav><div class="aside-note"><strong>「つねに」とは？</strong><p>条件に合う<strong>どの図でも</strong>成り立つこと。<br>反例が1つでもあれば、答えは×。</p></div></aside>
<section class="workspace"><div class="problem-head"><div><div class="eyebrow" id="sectionName"></div><h1 id="problemTitle"></h1></div><span id="overall" class="overall"></span></div>
<div class="statement"><div><span class="tag">条件</span><p id="condition"></p></div><span class="implies">→</span><div><span class="tag">確かめる結論</span><p id="conclusion"></p></div></div>
<section class="explorer" aria-label="図を使って確かめる"><div class="scene-top"><div class="legend"><span class="ll">● 直線 ℓ</span><span class="mm">● 直線 m</span><span class="nn" id="nLegend">● 直線 n</span><span class="pp" id="pLegend">▱ 平面 P</span></div><span class="condition-ok">✓ どの図も条件を満たしています</span></div>
<div class="scene" id="scene"><svg id="drawing" viewBox="0 0 940 480" role="img" aria-labelledby="diagramTitle diagramDesc"><title id="diagramTitle">立体図</title><desc id="diagramDesc"></desc></svg><div class="scene-hint">↔ ドラッグで回転・ピンチやホイールで拡大</div><div class="view-controls"><button data-view="space">立体</button><button data-view="front">正面</button><button data-view="top">真上</button><button id="resetView" aria-label="視点と拡大率を戻す">↺ 戻す</button></div></div>
<div class="case-area"><div class="case-heading"><span class="eyebrow">図を切り替える</span><span id="caseCount"></span></div><div id="cases" class="cases"></div></div></section>
<section class="explanation" aria-live="polite"><div id="caseBadge" class="case-badge"></div><div><h2 id="caseTitle"></h2><p id="caseText"></p><div id="reason" class="reason"></div></div></section>
<footer><span id="problemPosition"></span><span>線は両方向に続きます。平面 P も図の外へ広がります。</span><div><button id="previous">← 前の問題</button><button id="next">次の問題 →</button></div></footer>
</section></main><script src="app.js"></script></body></html>
